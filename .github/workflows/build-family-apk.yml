name: 가족 앱 APK 만들기

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4
      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK 제작
        run: gradle assembleDebug
        working-directory: family-android-app
      - name: APK 다운로드 파일 등록
        uses: actions/upload-artifact@v4
        with:
          name: 우리-가족-이야기-APK
          path: app/build/outputs/apk/debug/app-debug.apk
